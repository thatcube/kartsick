<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
  <title id="title">Kartsick: eight residents of Belltumble</title>
  <desc id="desc">Original flat silhouette studies, not production models. Zipwick the violet folded-ear rabbit and Clatter the orange cicada courier; Mallowmere the chartreuse ram and Tippet the fabric trail guide; Dulcibelle the apricot moth and Lord Knurl the blue mole; Wobbin the turquoise ribbon kite and Latch the yellow instrument robot. Four paired panels include their proposed shared special names.</desc>
