<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc">
  <title id="title">Kartsick: recognizable roots, wrong proportions</title>
  <desc id="desc">Second concept pass. Eight new character drawings with named design influences: Clutch, a stocky mechanic with enormous mustache, influenced by Mario; Bramble, a leaf-eared mapmaker influenced by Link; Pompa, a copper-haired duchess influenced by Princess Peach; Bront, a coral caiman brawler influenced by Bowser; Rivet, a magenta tenrec speedster influenced by Sonic; Pipvolt, an apricot electric jerboa influenced by Pikachu; Bollo, a blue triangular cushion creature influenced by Kirby; and Hunkle, a mint-gray orangutan in a cropped track jacket influenced by Donkey Kong. Reference characters are named, not pictured. These are unapproved concept studies, not production art.</desc>
